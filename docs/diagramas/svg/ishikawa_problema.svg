<text x="2120.0" y="578.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2328" text-anchor="middle"><tspan x="2120.0" dy="0.0">La valoración del rango de</tspan><tspan x="2120.0" dy="30.0">movimiento de rodilla es</tspan><tspan x="2120.0" dy="30.0">costosa, depende de un</tspan><tspan x="2120.0" dy="30.0">profesional y su medición</tspan><tspan x="2120.0" dy="30.0">manual es variable: quien</tspan><tspan x="2120.0" dy="30.0">entrena suele quedarse sin una</tspan><tspan x="2120.0" dy="30.0">medida objetiva</tspan></text>
