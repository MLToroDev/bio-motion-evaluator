# Compose legado: solo Redis.
# Preferir el stack completo en la raíz del monorepo:
#   docker compose up --build
# (ver docker-compose.yml en la raíz y docs/guias/SETUP.md)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
